name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - rc
      - release
      - release/*

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:

  continuous-integration:
    runs-on: ubuntu-latest
    if: github.repository == 'FacsimiLab/faxlab-tools'

    steps:
      # Note: we need to checkout the repository at the workflow sha in case during the workflow
      # the branch was updated. To keep PSR working with the configured release branches,
      # we force a checkout of the desired release branch but at the workflow sha HEAD.
      - name: Setup | Checkout Repository at workflow sha
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          
      - name: Setup | Force correct release branch on workflow SHA
        run: |
          git checkout -B ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          restore-cache: true
          cache-dependency-glob: |
              **/uv.lock
              **/pyproject.toml

      - name: Create Virtual Environment & Install Dependencies
        run: |
          uv sync --dev --all-extras

      - name: Testing
        run: |
          uv run pytest -s -v


      - name: Python Semantic Release (Main Branch)
        id: semvar-tag-main-branch
        if: ${{ github.ref_name == 'main' }}
        uses: pranavmishra90/semvar-docker@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_email: "195262995+facsimilab-bot@users.noreply.github.com"
          ssh_private_signing_key: ${{ secrets.FACSIMILAB_BOT_SSHKEY }}
          ssh_public_signing_key: ${{ secrets.FACSIMILAB_BOT_SSH_PUBKEY }}
          build: "false"
          changelog: "true"
          commit: "false"
          tag: "false"
          vcs_release: "false"
          push: "false"
          root_options: "-v"


      - name: Python Semantic Release
        id: semvar-tag-rc
        if: ${{ github.ref_name != 'main' }}
        uses: pranavmishra90/semvar-docker@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_email: "195262995+facsimilab-bot@users.noreply.github.com"
          ssh_private_signing_key: ${{ secrets.FACSIMILAB_BOT_SSHKEY }}
          ssh_public_signing_key: ${{ secrets.FACSIMILAB_BOT_SSH_PUBKEY }}
          build: "false"
          changelog: "true"
          commit: "true"
          tag: "true"
          vcs_release: "false"
          push: "true"
          root_options: "-v"

      - name: Workflow Status
        run: |
          echo "## Python Semantic Release - GitHub Action" >> $GITHUB_STEP_SUMMARY
          echo ""  >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.semvar-main-branch.outputs.version }} ${{ steps.semvar-tag-rc.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo ""  >> $GITHUB_STEP_SUMMARY
          printf "Tags: $(git tag -l)" >> $GITHUB_STEP_SUMMARY
          echo ""  >> $GITHUB_STEP_SUMMARY
          echo "Released: ${{ steps.semvar-main-branch.outputs.released }}" >> $GITHUB_STEP_SUMMARY
          echo ""  >> $GITHUB_STEP_SUMMARY
          cat CHANGELOG.md >> $GITHUB_STEP_SUMMARY
